on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install pygame==2.5.2 pyinstaller==5.13.0 pytmx websocket-client requests
        if exist requirements.txt pip install -r requirements.txt
    
    - name: Check Icon Path
      shell: cmd
      run: |
        if exist "images/icon.ico" (
          echo Icon found!
        ) else (
          echo ERROR: images/icon.ico not found in repository!
          dir /s /b icon.ico
          exit 1
        )
    
    - name: Build Game EXE
      shell: cmd
      run: |
        pyinstaller --noconfirm --onedir --name=Game ^
          --icon="images/icon.ico" ^
          --hidden-import=pygame ^
          --hidden-import=pytmx ^
          --hidden-import=websocket ^
          --hidden-import=requests ^
          --add-data="images;images" ^
          --add-data="music;music" ^
          --add-data="maps;maps" ^
          --add-data="sprites;sprites" ^
          main.py
    
    - name: Build Launcher EXE
      shell: cmd
      run: |
        :: Сначала находим путь к Tcl/Tk
        python -c "import tkinter; import os; tcl_dir = os.path.join(os.path.dirname(tkinter.__file__), 'tcl'); tk_dir = os.path.join(os.path.dirname(tkinter.__file__), 'tk'); print(f'TCL: {tcl_dir}'); print(f'TK: {tk_dir}')"
        
        :: Собираем лаунчер с явным указанием Tcl/Tk
        pyinstaller --noconfirm --onedir --name=Launcher ^
          --icon="images/icon.ico" ^
          --hidden-import=tkinter ^
          --hidden-import=requests ^
          --add-data="images;images" ^
          --add-data="tcl86t.dll;." ^
          --add-data="tk86t.dll;." ^
          --collect-all tkinter ^
          launcher.py
    
    - name: Create Final Folder
      shell: cmd
      run: |
        mkdir Final_Release
        
        :: Копируем Game
        if exist dist\Game (
          xcopy dist\Game Final_Release\Game /E /I /Y
        ) else (
          echo ERROR: dist\Game does not exist!
          exit 1
        )
        
        :: Копируем Launcher и ВСЕ его зависимости
        if exist dist\Launcher (
          xcopy dist\Launcher Final_Release /E /I /Y
        ) else (
          echo ERROR: dist\Launcher does not exist!
          exit 1
        )
        
        :: Проверяем наличие Tcl/Tk файлов
        echo Checking Tcl/Tk files...
        dir Final_Release\tcl /s
        dir Final_Release\tk /s
        
    - name: Create ZIP archive
      shell: pwsh
      run: |
        $path = "Final_Release"
        if ((Test-Path $path) -and (Get-ChildItem $path)) {
            Compress-Archive -Path "Final_Release\*" -DestinationPath "Game-Windows.zip" -Force
            Write-Host "ZIP created successfully"
        } else {
            Write-Error "Final_Release is empty or does not exist!"
            exit 1
        }
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Game-Full-Build
        path: Game-Windows.zip 
