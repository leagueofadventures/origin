name: Build Python to EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Check for requirements
      id: check-reqs
      run: |
        if [ -f "requirements.txt" ]; then
          echo "requirements_exists=true" >> $GITHUB_OUTPUT
        else
          echo "requirements_exists=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Install requirements
      if: steps.check-reqs.outputs.requirements_exists == 'true'
      run: pip install -r requirements.txt
    
    - name: Build executable
      run: |
        echo "Building EXE..."
        
        # Базовая команда
        pyinstaller --onedir --name=MyApp main.py
        
        # Или с ресурсами (раскомментируйте если нужно)
        # pyinstaller --onedir --name=MyApp ^
        #   --add-data="images/*;images/" ^
        #   --add-data="maps/*;maps/" ^
        #   --add-data="music/*;music/" ^
        #   --add-data="sprites/PNG/*;sprites/PNG/" ^
        #   main.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyApp-Executable
        path: dist/