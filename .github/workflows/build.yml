name: EXE Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install pygame==2.5.2 pyinstaller==5.13.0 pytmx websocket-client requests
        if exist requirements.txt pip install -r requirements.txt
    
    # 1. Собираем Game.exe
    - name: Build Game EXE
      shell: cmd
      run: |
        echo Building Game.exe...
        pyinstaller --onedir --name=Game ^
          --hidden-import=pygame ^
          --hidden-import=pytmx ^
          --hidden-import=websocket ^
          --hidden-import=requests ^
          --add-data="images;images" ^
          --add-data="music;music" ^
          --add-data="maps;maps" ^
          --add-data="sprites;sprites" ^
          main.py
    
    # 2. Собираем Launcher.exe  
    - name: Build Launcher EXE
      shell: cmd
      run: |
        echo Building Launcher.exe...
        pyinstaller --onedir --name=Launcher ^
          --hidden-import=tkinter ^
          --hidden-import=requests ^
          launcher.py
    
    # 3. Создаем папку Game с двумя EXE
    - name: Create Game folder with both EXE
      shell: cmd
      run: |
        echo Creating Game folder with both EXE...
        
        # Создаем папку Game
        mkdir Game
        
        # Копируем ВСЕ из dist/Game в папку Game
        if exist dist\Game (
          xcopy dist\Game Game /E /I /Y
          echo Copied Game.exe and all dependencies
        )
        
        # Копируем Launcher.exe в ту же папку Game
        if exist dist\Launcher\Launcher.exe (
          copy dist\Launcher\Launcher.exe Game\Launcher.exe
          echo Copied Launcher.exe to Game folder
        )
        
        # Копируем общие DLL если нужно
        if not exist Game\python311.dll (
          if exist dist\Launcher\python311.dll (
            copy dist\Launcher\python311.dll Game\
          )
        )
        
        echo Structure of Game folder:
        dir Game
    
    - name: Create ZIP archive
      shell: cmd
      run: |
        echo Creating ZIP archive...
        
        if exist Game (
          powershell -Command "Compress-Archive -Path 'Game\*' -DestinationPath 'Game-Windows.zip' -Force"
          echo Archive created: Game-Windows.zip
        ) else (
          echo ERROR: Game folder not found!
          exit 1
        )
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Game-Folder-with-Two-EXE
        path: |
          Game-Windows.zip
          Game/
