name: Build Python to EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install ALL dependencies first
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        
        # Сначала устанавливаем ВСЕ зависимости из requirements.txt
        if exist requirements.txt (
          pip install -r requirements.txt
        )
        
        # Потом устанавливаем pyinstaller
        pip install pyinstaller
    
    - name: Build executable with resources
      shell: cmd
      run: |
        echo Building EXE with resources...
        
        pyinstaller --onedir --name=MyApp ^
          --hidden-import=pygame ^
          --hidden-import=pygame._sdl2 ^
          --hidden-import=pygame.mixer ^
          --hidden-import=pygame.font ^
          --collect-all=pygame ^
          --add-data="images/*;images/" ^
          --add-data="music/*;music/" ^
          --add-data="maps/*;maps/" ^
          --add-data="sprites/PNG/*;sprites/PNG/" ^
          main.py
    
    - name: Create ZIP archive
      shell: cmd
      run: |
        echo Creating ZIP archive...
        
        if exist dist\MyApp (
          ren dist\MyApp MyApp-Windows
          powershell -Command "Compress-Archive -Path 'dist\MyApp-Windows\*' -DestinationPath 'MyApp-Windows.zip' -Force"
          echo Archive created successfully
        ) else (
          echo ERROR: dist\MyApp folder not found!
          dir dist
        )
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MyApp-Executable
        path: |
          MyApp-Windows.zip
          dist/MyApp-Windows/
