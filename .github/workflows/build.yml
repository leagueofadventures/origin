name: Build Complete Game Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install pygame==2.5.2 pyinstaller==5.13.0 pytmx websocket-client requests
        if exist requirements.txt pip install -r requirements.txt
    
    - name: Build Complete Package
      shell: cmd
      run: |
        echo Building complete game package...
        
        # Собираем лаунчер как ОСНОВНОЙ EXE
        pyinstaller --onedir --name="LeagueOfAdventures" ^
          --hidden-import=pygame ^
          --hidden-import=pytmx ^
          --hidden-import=websocket ^
          --hidden-import=tkinter ^
          --hidden-import=requests ^
          --add-data="main.py;." ^           # Добавляем main.py как файл
          --add-data="images;images" ^
          --add-data="music;music" ^
          --add-data="maps;maps" ^
          --add-data="sprites;sprites" ^
          launcher.py                         # Основной файл - лаунчер
    
    - name: Create ZIP archive
      shell: cmd
      run: |
        echo Creating ZIP archive...
        
        if exist "dist\LeagueOfAdventures" (
          ren "dist\LeagueOfAdventures" "LeagueOfAdventures-Windows"
          powershell -Command "Compress-Archive -Path 'dist\LeagueOfAdventures-Windows\*' -DestinationPath 'LeagueOfAdventures-Windows.zip' -Force"
          echo ✓ Archive created
        ) else (
          echo ✗ ERROR: Build folder not found!
          dir dist
          exit 1
        )
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LeagueOfAdventures-Complete
        path: |
          LeagueOfAdventures-Windows.zip
          dist/LeagueOfAdventures-Windows/
