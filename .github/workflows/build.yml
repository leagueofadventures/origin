name: Build Python to EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install pygame==2.5.2 pyinstaller==5.13.0 pytmx websocket-client
        if exist requirements.txt pip install -r requirements.txt
    
    - name: Build EXE with proper resource handling
      shell: cmd
      run: |
        pyinstaller --onedir --name=MyApp ^
          --hidden-import=pygame ^
          --hidden-import=pytmx ^
          --hidden-import=websocket ^
          --add-data="images;images" ^
          --add-data="music;music" ^
          --add-data="maps;maps" ^
          --add-data="sprites;sprites" ^
          main.py
    
    - name: Create ZIP archive
      shell: cmd
      run: |
        if exist dist\MyApp (
          ren dist\MyApp MyApp-Windows
          powershell -Command "Compress-Archive -Path 'dist\MyApp-Windows\*' -DestinationPath 'MyApp-Windows.zip' -Force"
          echo Archive created successfully
        ) else (
          echo ERROR: Build failed - dist\MyApp not found
          exit 1
        )
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MyApp-Executable
        path: |
          MyApp-Windows.zip
          dist/MyApp-Windows/
