name: Build League of Adventures Launcher

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install pygame==2.5.2 pyinstaller==5.13.0 pytmx websocket-client requests
        if exist requirements.txt pip install -r requirements.txt
    
    - name: Build Launcher EXE
      shell: cmd
      run: |
        echo Building League of Adventures Launcher...
        
        pyinstaller --onedir --name="LeagueOfAdventuresLauncher" ^
          --hidden-import=pygame ^
          --hidden-import=pytmx ^
          --hidden-import=websocket ^
          --hidden-import=tkinter ^
          --hidden-import=requests ^
          --hidden-import=requests.adapters ^
          --hidden-import=requests.auth ^
          --hidden-import=requests.certs ^
          --hidden-import=requests.compat ^
          --hidden-import=requests.cookies ^
          --hidden-import=requests.exceptions ^
          --hidden-import=requests.hooks ^
          --hidden-import=requests.models ^
          --hidden-import=requests.packages ^
          --hidden-import=requests.sessions ^
          --hidden-import=requests.status_codes ^
          --hidden-import=requests.structures ^
          --hidden-import=requests.utils ^
          --add-data="main.py;." ^
          --add-data="images;images" ^
          --add-data="music;music" ^
          --add-data="maps;maps" ^
          --add-data="sprites;sprites" ^
          launcher.py
    
    - name: Create ZIP archive
      shell: cmd
      run: |
        echo Creating ZIP archive...
        
        if exist "dist\LeagueOfAdventuresLauncher" (
          echo Found dist\LeagueOfAdventuresLauncher folder
          
          # Переименовываем папку
          ren "dist\LeagueOfAdventuresLauncher" "LeagueOfAdventures-Windows"
          echo Renamed to LeagueOfAdventures-Windows
          
          # Создаем ZIP
          powershell -Command "Compress-Archive -Path 'dist\LeagueOfAdventures-Windows\*' -DestinationPath 'LeagueOfAdventures-Windows.zip' -Force"
          
          echo ✓ ZIP archive created
        ) else (
          echo ✗ ERROR: dist\LeagueOfAdventuresLauncher folder not found!
          echo Listing dist folder:
          dir dist
          exit 1
        )
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LeagueOfAdventures-Launcher
        path: |
          LeagueOfAdventures-Windows.zip
          dist/LeagueOfAdventures-Windows/
