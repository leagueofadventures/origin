name: EXE Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install pygame==2.5.2 pyinstaller==5.13.0 pytmx websocket-client requests
        if exist requirements.txt pip install -r requirements.txt
    
    # 1. Собираем Game.exe с иконкой
    - name: Build Game EXE
      shell: cmd
      run: |
        echo Building main.exe...
        pyinstaller --onedir --name=main ^
          --icon="images/icon.ico" ^
          --hidden-import=pygame ^
          --hidden-import=pytmx ^
          --hidden-import=websocket ^
          --hidden-import=requests ^
          --add-data="images;images" ^
          --add-data="music;music" ^
          --add-data="maps;maps" ^
          --add-data="sprites;sprites" ^
          main.py
    
    # 2. Собираем Launcher.exe с иконкой
    - name: Build Launcher EXE
      shell: cmd
      run: |
        echo Building Launcher.exe...
        pyinstaller --onedir --name=League-of-Adventures ^
          --icon="images/icon.ico" ^
          --hidden-import=tkinter ^
          --hidden-import=requests ^
          launcher.py
    
    # 3. Объединяем всё в одну папку и фиксим ошибку TK
    - name: Create Game folder with both EXE
      shell: cmd
      run: |
        echo Creating Final Release Folder...
        
        if not exist Game mkdir Game
        
        :: 1. Копируем всё из сборки основной игры
        if exist dist\Game (
          xcopy dist\Game Game /E /I /Y
        )
        
        :: 2. Копируем только исполняемый файл лаунчера
        if exist dist\Launcher\Launcher.exe (
          copy dist\Launcher\Launcher.exe Game\Launcher.exe
        )
        
        :: 3. ИСПРАВЛЕНИЕ ОШИБКИ TK: Копируем папки tcl и tk из дистрибутива лаунчера
        if exist dist\Launcher\tcl (
          xcopy dist\Launcher\tcl Game\tcl /E /I /Y
        )
        if exist dist\Launcher\tk (
          xcopy dist\Launcher\tk Game\tk /E /I /Y
        )
        
        :: 4. Докопируем DLL, которые могли понадобиться лаунчеру (включая tcl86t.dll и т.д.)
        xcopy dist\Launcher\*.dll Game\ /Y /D
        
        echo Final folder structure:
        dir Game
    
    - name: Create ZIP archive
      shell: cmd
      run: |
        powershell -Command "Compress-Archive -Path 'Game\*' -DestinationPath 'Game-Windows.zip' -Force"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Game-Full-Build
        path: Game-Windows.zip
