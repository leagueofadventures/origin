name: Build Python to EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install PyInstaller
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Check for requirements
      id: check-reqs
      shell: cmd
      run: |
        if exist requirements.txt (
          echo requirements_exists=true >> %GITHUB_OUTPUT%
        ) else (
          echo requirements_exists=false >> %GITHUB_OUTPUT%
        )
    
    - name: Install requirements
      if: steps.check-reqs.outputs.requirements_exists == 'true'
      shell: cmd
      run: pip install -r requirements.txt
    
    - name: Build executable
      shell: cmd
      run: |
        echo Building EXE...
        pyinstaller --onedir --name=MyApp main.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyApp-Executable
        path: dist/
