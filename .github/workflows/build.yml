name: Build Python to EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install with Force Reinstall
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip uninstall pygame -y
        pip uninstall pyinstaller -y
        pip install pygame==2.5.2
        pip install pyinstaller==5.13.0
        if exist requirements.txt (
          pip install -r requirements.txt
        )
    
    - name: Verify Pygame Installation
      shell: cmd
      run: |
        python -c "import sys; print('Python path:'); [print(f'  {p}') for p in sys.path]; \
        try: \
          import pygame; \
          print(f'✓ Pygame imported: {pygame.version.ver}'); \
          import pygame as pg; \
          print(f'Pygame location: {pg.__file__}'); \
        except ImportError as e: \
          print(f'✗ Pygame import failed: {e}'); \
          import site, os; \
          print('Searching for pygame...'); \
          [print(f'Found pygame at: {os.path.join(sp, \"pygame\")}') for sp in site.getsitepackages() if os.path.exists(os.path.join(sp, 'pygame'))]"
    
    - name: Build with Extended Pygame Imports
      shell: cmd
      run: |
        pyinstaller --onedir --name=MyApp ^
          --hidden-import=pygame ^
          --hidden-import=pygame.base ^
          --hidden-import=pygame.constants ^
          --hidden-import=pygame.display ^
          --hidden-import=pygame.draw ^
          --hidden-import=pygame.event ^
          --hidden-import=pygame.font ^
          --hidden-import=pygame.image ^
          --hidden-import=pygame.joystick ^
          --hidden-import=pygame.key ^
          --hidden-import=pygame.mixer ^
          --hidden-import=pygame.mixer.music ^
          --hidden-import=pygame.mouse ^
          --hidden-import=pygame.rect ^
          --hidden-import=pygame.sprite ^
          --hidden-import=pygame.surface ^
          --hidden-import=pygame.time ^
          --hidden-import=pygame.transform ^
          --hidden-import=pygame._sdl2 ^
          --hidden-import=pygame._sdl2.audio ^
          --hidden-import=pygame._sdl2.video ^
          --collect-all=pygame ^
          --add-data="images/*;images/" ^
          --add-data="music/*;music/" ^
          --add-data="maps/*;maps/" ^
          --add-data="sprites/PNG/*;sprites/PNG/" ^
          main.py
    
    - name: Test the Built EXE
      shell: cmd
      run: |
        if exist dist\MyApp\MyApp.exe (
          cd dist\MyApp
          echo import sys > test.py
          echo try: >> test.py
          echo     import pygame >> test.py
          echo     print("Pygame OK:", pygame.version.ver) >> test.py
          echo except Exception as e: >> test.py
          echo     print("Error:", e) >> test.py
          python test.py
        )
    
    - name: Create ZIP archive
      shell: cmd
      run: |
        if exist dist\MyApp (
          ren dist\MyApp MyApp-Windows
          powershell -Command "Compress-Archive -Path 'dist\MyApp-Windows\*' -DestinationPath 'MyApp-Windows.zip'"
        )
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MyApp-Executable
        path: |
          MyApp-Windows.zip
          dist/MyApp-Windows/
