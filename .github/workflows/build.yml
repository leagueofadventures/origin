name: EXE Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Это актуальная версия
    
    - name: Setup Python
      uses: actions/setup-python@v5 # Обновил до v5 (поддерживает Node 20+)
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install pygame==2.5.2 pyinstaller==5.13.0 pytmx websocket-client requests
        if exist requirements.txt pip install -r requirements.txt
    
    - name: Build Game EXE
      shell: cmd
      run: |
        pyinstaller --onedir --name=main ^
          --icon="images/icon.ico" ^
          --hidden-import=pygame ^
          --hidden-import=pytmx ^
          --hidden-import=websocket ^
          --hidden-import=requests ^
          --add-data="images;images" ^
          --add-data="music;music" ^
          --add-data="maps;maps" ^
          --add-data="sprites;sprites" ^
          main.py
    
    - name: Build Launcher EXE
      shell: cmd
      run: |
        pyinstaller --onedir --name=League-of-Adventures-Launcher ^
          --icon="images/icon.ico" ^
          --hidden-import=tkinter ^
          --hidden-import=requests ^
          launcher.py
    
    - name: Create Game folder with both EXE
      shell: cmd
      run: |
        if not exist Final_Release mkdir Final_Release
        
        :: Копируем основные файлы игры
        if exist dist\Game (
          xcopy dist\Game Final_Release /E /I /Y
        )
        
        :: Добавляем лаунчер и его зависимости для TK
        if exist dist\Launcher\Launcher.exe (
          copy dist\Launcher\Launcher.exe Final_Release\Launcher.exe
        )
        if exist dist\Launcher\tcl (
          xcopy dist\Launcher\tcl Final_Release\tcl /E /I /Y
        )
        if exist dist\Launcher\tk (
          xcopy dist\Launcher\tk Final_Release\tk /E /I /Y
        )
        xcopy dist\Launcher\*.dll Final_Release\ /Y /D
        
        dir Final_Release

    - name: Create ZIP archive
      shell: pwsh # Используем PowerShell Core для надежности
      run: |
        Compress-Archive -Path "Final_Release\*" -DestinationPath "Game-Windows.zip" -Force
        if (Test-Path "Game-Windows.zip") { Write-Host "ZIP created successfully" } else { throw "ZIP creation failed" }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4 # v4 — самая новая
      with:
        name: Game-Full-Build
        path: Game-Windows.zip
        if-no-files-found: error
