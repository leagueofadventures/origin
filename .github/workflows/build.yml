    - name: Build Launcher EXE with Tcl/Tk
      shell: pwsh
      run: |
        $pyPath = $env:pythonLocation
        $tclPath = "$pyPathtcltcl8.6"
        $tkPath = "$pyPathtcltk8.6"
        
        if (-not (Test-Path $tclPath)) {
            Write-Error "Tcl directory not found at: $tclPath"
            exit 1
        }
        if (-not (Test-Path $tkPath)) {
            Write-Error "Tk directory not found at: $tkPath"
            exit 1
        }
        
        pyinstaller --noconfirm --noconsole --onedir --name=Launcher `
          --icon="images/icon.ico" `
          --hidden-import=tkinter `
          --hidden-import=requests `
          --add-data="images;images" `
          launcher.py
        
        New-Item -ItemType Directory -Force -Path "distLaunchertcl"
        New-Item -ItemType Directory -Force -Path "distLaunchertk"
        xcopy "$tclPath" "distLaunchertcl" /E /I /Y
        xcopy "$tkPath" "distLaunchertk" /E /I /Y
        
        if (Test-Path "$pyPathtcl86t.dll") {
            Copy-Item "$pyPathtcl86t.dll" "distLauncher" -Force
        }
        if (Test-Path "$pyPathtk86t.dll") {
            Copy-Item "$pyPathtk86t.dll" "distLauncher" -Force
        }
