name: Build Game

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame==2.5.2 pyinstaller==5.13.0 pytmx websocket-client requests
    
    - name: Build Game EXE
      run: |
        pyinstaller --noconfirm --onedir --name=Game --icon="images/icon.ico" --add-data="images;images" --add-data="music;music" --add-data="maps;maps" --add-data="sprites;sprites" main.py
    
    - name: Build Launcher EXE (console mode for debugging)
      run: |
        # Сначала пробуем собрать в консольном режиме для отладки
        pyinstaller --noconfirm --onedir --name=Launcher --console --icon="images/icon.ico" --add-data="images;images" launcher.py
    
    - name: Copy Tcl/Tk files manually
      run: |
        # Копируем необходимые файлы Tcl/Tk
        copy "C:\hostedtoolcache\windows\Python\3.11.9\x64\DLLs\tcl86t.dll" "dist\Launcher\"
        copy "C:\hostedtoolcache\windows\Python\3.11.9\x64\DLLs\tk86t.dll" "dist\Launcher\"
        
        # Создаем папки и копируем содержимое
        mkdir "dist\Launcher\tcl"
        mkdir "dist\Launcher\tk"
        xcopy "C:\hostedtoolcache\windows\Python\3.11.9\x64\Lib\tkinter\tcl\*" "dist\Launcher\tcl\" /E /I /Y
        xcopy "C:\hostedtoolcache\windows\Python\3.11.9\x64\Lib\tkinter\tk\*" "dist\Launcher\tk\" /E /I /Y
    
    - name: Test Launcher
      run: |
        echo "Testing launcher..."
        cd "dist\Launcher"
        dir
        echo "Launcher files listed above"
    
    - name: Create Final Release
      run: |
        mkdir Final_Release
        xcopy "dist\Game" "Final_Release\Game" /E /I /Y
        xcopy "dist\Launcher" "Final_Release" /E /I /Y
    
    - name: Create ZIP
      run: |
        Compress-Archive -Path "Final_Release\*" -DestinationPath "Game-Windows.zip" -Force
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Game-Full-Build
        path: Game-Windows.zip

        
