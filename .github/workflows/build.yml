on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install pygame==2.5.2 pyinstaller==5.13.0 pytmx websocket-client requests
        if exist requirements.txt pip install -r requirements.txt

    # ПРОВЕРКА: Есть ли файл иконки на самом деле?
    - name: Check Icon Path
      shell: cmd
      run: |
        if exist "images/icon.ico" (
          echo Icon found!
        ) else (
          echo ERROR: images/icon.ico not found in repository!
          dir /s /b icon.ico
          exit 1
        )
    
    - name: Build Game EXE
      shell: cmd
      run: |
        pyinstaller --noconfirm --onedir --name=main ^
          --icon="images/icon.ico" ^
          --hidden-import=pygame ^
          --hidden-import=pytmx ^
          --hidden-import=websocket ^
          --hidden-import=requests ^
          --add-data="images;images" ^
          --add-data="music;music" ^
          --add-data="maps;maps" ^
          --add-data="sprites;sprites" ^
          main.py
    
    - name: Build Launcher EXE
      shell: cmd
      run: |
        pyinstaller --noconfirm --onedir --name=League-of-Adventures-Launcher ^
          --icon="images/icon.ico" ^
          --hidden-import=tkinter ^
          --hidden-import=requests ^
          launcher.py
    
    - name: Create Final Folder
      shell: cmd
      run: |
        mkdir Final_Release
        
        :: Копируем Game (если собралось)
        if exist dist\Game (
          xcopy dist\Game Final_Release /E /I /Y
        ) else (
          echo ERROR: dist\Game does not exist!
          exit 1
        )
        
        :: Копируем Launcher и зависимости TK
        if exist dist\Launcher\Launcher.exe (
          copy dist\Launcher\Launcher.exe Final_Release\Launcher.exe
          if exist dist\Launcher\tcl xcopy dist\Launcher\tcl Final_Release\tcl /E /I /Y
          if exist dist\Launcher\tk xcopy dist\Launcher\tk Final_Release\tk /E /I /Y
          xcopy dist\Launcher\*.dll Final_Release\ /Y /D
        ) else (
          echo ERROR: Launcher.exe not found!
          exit 1
        )

    - name: Create ZIP archive
      shell: pwsh
      run: |
        $path = "Final_Release"
        if ((Test-Path $path) -and (Get-ChildItem $path)) {
            Compress-Archive -Path "Final_Release\*" -DestinationPath "Game-Windows.zip" -Force
            Write-Host "ZIP created successfully"
        } else {
            Write-Error "Final_Release is empty or does not exist!"
            exit 1
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Game-Full-Build
        path: Game-Windows.zip
