name: Build Game and Launcher

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install pygame==2.5.2 pyinstaller==5.13.0 pytmx websocket-client requests
        if exist requirements.txt pip install -r requirements.txt
    
    # 1. Собираем ОСНОВНУЮ ИГРУ (main.py -> Game.exe)
    - name: Build Main Game EXE
      shell: cmd
      run: |
        echo Building Main Game EXE...
        
        pyinstaller --onedir --name="LeagueOfAdventures" ^
          --hidden-import=pygame ^
          --hidden-import=pytmx ^
          --hidden-import=websocket ^
          --hidden-import=requests ^
          --add-data="images;images" ^
          --add-data="music;music" ^
          --add-data="maps;maps" ^
          --add-data="sprites;sprites" ^
          main.py
    
    # 2. Собираем ЛАУНЧЕР (launcher.py -> Launcher.exe)
    - name: Build Launcher EXE
      shell: cmd
      run: |
        echo Building Launcher EXE...
        
        pyinstaller --onedir --name="LeagueOfAdventuresLauncher" ^
          --hidden-import=tkinter ^
          --hidden-import=requests ^
          launcher.py
    
    - name: Create combined ZIP archive
      shell: cmd
      run: |
        echo Creating combined ZIP archive...
        
        # Создаем общую папку
        mkdir LeagueOfAdventures-Complete
        
        # Копируем игру
        if exist "dist\LeagueOfAdventures" (
          xcopy "dist\LeagueOfAdventures" "LeagueOfAdventures-Complete\Game" /E /I /Y
          echo Copied game files
        )
        
        # Копируем лаунчер
        if exist "dist\LeagueOfAdventuresLauncher" (
          xcopy "dist\LeagueOfAdventuresLauncher" "LeagueOfAdventures-Complete\Launcher" /E /I /Y
          echo Copied launcher files
        )
        
        # Создаем инструкцию
        echo # League of Adventures > "LeagueOfAdventures-Complete\README.txt"
        echo. >> "LeagueOfAdventures-Complete\README.txt"
        echo Запустите Launcher.exe для запуска игры с обновлениями >> "LeagueOfAdventures-Complete\README.txt"
        echo или Game.exe для запуска игры напрямую >> "LeagueOfAdventures-Complete\README.txt"
        
        # Создаем ZIP
        powershell -Command "Compress-Archive -Path 'LeagueOfAdventures-Complete\*' -DestinationPath 'LeagueOfAdventures-Complete.zip' -Force"
        
        echo ✓ Combined archive created
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LeagueOfAdventures-Complete
        path: |
          LeagueOfAdventures-Complete.zip
          LeagueOfAdventures-Complete/
