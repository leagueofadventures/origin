name: EXE Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install PyInstaller and Pygame
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install pygame pyinstaller
    
    - name: Check for requirements
      id: check-reqs
      shell: cmd
      run: |
        if exist requirements.txt (
          echo requirements_exists=true >> %GITHUB_OUTPUT%
        ) else (
          echo requirements_exists=false >> %GITHUB_OUTPUT%
        )
    
    - name: Install requirements
      if: steps.check-reqs.outputs.requirements_exists == 'true'
      shell: cmd
      run: pip install -r requirements.txt
    
    - name: Build executable with Pygame support
      shell: cmd
      run: |
        echo Building EXE with Pygame support...
        
        pyinstaller --onedir --name=MyApp ^
          --hidden-import=pygame ^
          --hidden-import=pygame._sdl2 ^
          --hidden-import=pygame.mixer ^
          --hidden-import=pygame.font ^
          --collect-all=pygame ^
          --add-data="images/*;images/" ^
          --add-data="maps/*;maps/" ^
          --add-data="music/*;music/" ^
          --add-data="sprites/PNG/*;sprites/PNG/" ^
          main.py
    
    - name: Create ZIP archive
      shell: cmd
      run: |
        echo Creating ZIP archive...
        
        if exist dist\MyApp (
          ren dist\MyApp MyApp-Windows
          powershell -Command "Compress-Archive -Path 'dist\MyApp-Windows\*' -DestinationPath 'MyApp-Windows.zip' -Force"
          echo Archive created successfully
        ) else (
          echo ERROR: dist\MyApp folder not found!
          dir dist
        )
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MyApp-Executable
        path: |
          MyApp-Windows.zip
          dist/MyApp-Windows/
