name: Build Python to EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install ALL dependencies first
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        
        # Сначала устанавливаем ВСЕ зависимости из requirements.txt
        if exist requirements.txt (
          pip install -r requirements.txt
        )
        
        # Потом устанавливаем pyinstaller
        pip install pyinstaller
    
    - name: Build executable with explicit pygame imports
      shell: cmd
      run: |
        echo Building EXE...
        
        pyinstaller --onedir --name=MyApp ^
          --hidden-import=pygame ^
          --hidden-import=pygame._sdl2 ^
          --hidden-import=pygame.mixer ^
          --hidden-import=pygame.font ^
          --collect-all=pygame ^
          main.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyApp-Executable
        path: dist/
