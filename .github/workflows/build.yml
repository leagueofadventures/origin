name: Build League of Adventures Launcher

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install pygame==2.5.2 pyinstaller==5.13.0 pytmx websocket-client
        if exist requirements.txt pip install -r requirements.txt
    
    - name: Build Launcher EXE
      shell: cmd
      run: |
        echo Building League of Adventures Launcher...
        
        pyinstaller --onedir --name="League of Adventures Launcher" ^
          --hidden-import=pygame ^
          --hidden-import=pytmx ^
          --hidden-import=websocket ^
          --hidden-import=tkinter ^
          --add-data="main.py;." ^
          --add-data="images;images" ^
          --add-data="music;music" ^
          --add-data="maps;maps" ^
          --add-data="sprites;sprites" ^
          launcher.py
    
    - name: Create ZIP archive
      shell: cmd
      run: |
        echo Creating ZIP archive...
        
        if exist "dist\League of Adventures Launcher" (
          ren "dist\League of Adventures Launcher" "League of Adventures-Windows"
          powershell -Command "Compress-Archive -Path 'dist\League of Adventures-Windows\*' -DestinationPath 'League of Adventures-Windows.zip' -Force"
          echo Archive created successfully
        ) else (
          echo ERROR: dist\League of Adventures Launcher folder not found!
          dir dist
        )
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: League-of-Adventures-Launcher
        path: |
          "League of Adventures-Windows.zip"
          "dist/League of Adventures-Windows/"
