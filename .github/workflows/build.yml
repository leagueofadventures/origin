
name: Build Game

on:
  push:
    branches: ['main']
    paths:                          
      - 'main.py'
      - 'launcher.py'
      - 'images/**'
      - 'music/**'
      - 'maps/**'
      - 'sprites/**'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write


jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install pygame==2.5.2 pyinstaller==5.13.0 pytmx websocket-client requests
        if exist requirements.txt pip install -r requirements.txt
    
    - name: Check Icon Path
      shell: cmd
      run: |
        if exist "images/icon.ico" (
          echo Icon found!
        ) else (
          echo ERROR: images/icon.ico not found in repository!
          dir /s /b icon.ico
          exit 1
        )
    
    - name: Build Game EXE
      shell: cmd
      run: |
        pyinstaller --noconfirm --noconsole --onedir --name=main ^
          --icon="images/icon.ico" ^
          --hidden-import=pygame ^
          --hidden-import=pytmx ^
          --hidden-import=websocket ^
          --hidden-import=requests ^
          --add-data="images;images" ^
          --add-data="music;music" ^
          --add-data="maps;maps" ^
          --add-data="sprites;sprites" ^
          main.py
    
    - name: Build Launcher EXE
      shell: pwsh
      run: |
        $pyPath = $env:pythonLocation
        
        pyinstaller --noconfirm --noconsole --onedir --name=Launcher `
          --icon="images/icon.ico" `
          --hidden-import=tkinter `
          --hidden-import=requests `
          --add-data="images;images" `
          --add-binary "$pyPath\DLLs\tcl86t.dll;." `
          --add-binary "$pyPath\DLLs\tk86t.dll;." `
          launcher.py
          
        if (Test-Path "$pyPath\tcl") {
            xcopy "$pyPath\tcl\tcl*" "dist\Launcher\tcl\" /E /I /Y
            xcopy "$pyPath\tcl\tk*" "dist\Launcher\tk\" /E /I /Y
        } else {
            xcopy "$pyPath\Lib\tkinter\tcl" "dist\Launcher\tcl\" /E /I /Y
            xcopy "$pyPath\Lib\tkinter\tk" "dist\Launcher\tk\" /E /I /Y
        }
    - name: Create Final Folder
      shell: cmd
      run: |
        mkdir Final_Release
        
        if exist dist\main (
          xcopy dist\main Final_Release\Game /E /I /Y
        )
        
        if exist dist\Launcher (
          xcopy dist\Launcher Final_Release /E /I /Y
        )
        
        dir Final_Release
    
    - name: Create ZIP archive
      shell: pwsh
      run: |
        if (Test-Path "Final_Release") {
            Compress-Archive -Path "Final_Release\*" -DestinationPath "Leagueofadventures.zip" -Force
            Write-Host "ZIP created successfully"
        } else {
            Write-Error "Final_Release does not exist!"
            exit 1
        }
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: League of Adventures
        path: Leagueofadventures.zip
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: Leagueofadventures.zip
        # Используем дату и короткий SHA коммита для названия, если нет тега
        tag_name: "build-${{ github.sha }}"
        name: "League of Adventures v1.0.0"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

