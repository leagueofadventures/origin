name: Build Game with Tcl/Tk Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install pygame pytmx websocket-client requests pyinstaller
    
    - name: Build Game EXE
      run: |
        pyinstaller --onedir --name=main main.py
    
    - name: Build Launcher EXE
      run: |
        pyinstaller --onedir --name=League-of-Adventures launcher.py
    
    - name: Create combined folder
      run: |
        mkdir Game
        cp -r dist/Game/* Game/
        cp -r dist/Launcher/* Game/
    
    - uses: actions/upload-artifact@v4
      with:
        name: Game-Folder
        path: Game/
